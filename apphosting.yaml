# Placeholder values. Run `npm run configure` to regenerate this file from your .env.local.
# Contains public settings and Secret Manager references only.
runConfig:
  runtime: nodejs24
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 50

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://app.example.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_PUBLISHED_SITE_URL
    value: "https://pages.example.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: "support@example.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "your-firebase-web-api-key"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "your-firebase-project-id.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "your-firebase-project-id"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "your-firebase-project-id.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "000000000000"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:000000000000:web:0000000000000000000000"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION
    value: "europe-west4"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-XXXXXXXXXX"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "your-recaptcha-v3-site-key"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SOCIAL_PROFILES
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: POLAR_SERVER
    value: "sandbox"
    availability:
      - RUNTIME

  - variable: POLAR_CREDITS_PRODUCT_ID
    value: "your-polar-credits-product-id"
    availability:
      - RUNTIME

  - variable: POLAR_PRODUCT_CREATOR_MONTHLY
    value: "your-polar-creator-monthly-product-id"
    availability:
      - RUNTIME

  - variable: POLAR_PRODUCT_CREATOR_YEARLY
    value: "your-polar-creator-yearly-product-id"
    availability:
      - RUNTIME

  - variable: POLAR_PRODUCT_ARCHIVE_MONTHLY
    value: "your-polar-archive-monthly-product-id"
    availability:
      - RUNTIME

  - variable: POLAR_PRODUCT_ARCHIVE_YEARLY
    value: "your-polar-archive-yearly-product-id"
    availability:
      - RUNTIME

  - variable: OPENAI_TEXT_MODEL
    value: "gpt-6-sol"
    availability:
      - RUNTIME

  - variable: OPENAI_IMAGE_MODEL
    value: "gpt-image-2.5-flare"
    availability:
      - RUNTIME

  - variable: POLAR_ACCESS_TOKEN
    secret: "polar-access-token"
    availability:
      - RUNTIME

  - variable: OPENAI_API_KEY
    secret: "openai-api-key"
    availability:
      - RUNTIME
