runConfig:
  runtime: nodejs24
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 50

env:
  # ── Public Firebase config (safe to commit) ───────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBVDtmawDn2y3WstBrLGNeuVXde7Dg_pWs
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: milestis.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: milestis
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: milestis.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "396823314479"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:396823314479:web:7269a883f2e6de56bdc6da
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-1MTWED9VBW
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CREATEUSER_URL
    value: https://createuser-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CREATE_PROJECT_URL
    value: https://createproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FORCE_DELETE_PROJECT_URL
    value: https://forcedeleteproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_UNPUBLISH_PROJECT_URL
    value: https://unpublishproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_REPUBLISH_PROJECT_URL
    value: https://republishproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_PUBLISH_PROJECT_URL
    value: https://publishproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_ANALYZE_PROJECT_URL
    value: https://analyzeproject-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_EXPORT_USER_DATA_URL
    value: https://exportuserdata-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_EXPORT_PROJECT_CONTENT_URL
    value: https://exportprojectcontent-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME


  - variable: NEXT_PUBLIC_DELETE_USER_ACCOUNT_URL
    value: https://deleteuseraccount-5h4wes5waq-ez.a.run.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_APP_URL
    value: https://milestis.com
    availability:
      - BUILD
      - RUNTIME

  # ── Polar Billing ─────────────────────────────────────────────────────────
  # POLAR_ACCESS_TOKEN must be created in Firebase Secret Manager first:
  #   firebase apphosting:secrets:set polar-access-token
  - variable: POLAR_ACCESS_TOKEN
    secret: polar-access-token
    availability:
      - RUNTIME

  - variable: POLAR_SERVER
    value: production
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_POLAR_PRODUCT_CREATOR_MONTHLY
    value: 5174a41d-b7a6-4732-b60d-93fc7b923995
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POLAR_PRODUCT_CREATOR_YEARLY
    value: 257c0482-e452-4308-9611-c084977b4cc1
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POLAR_PRODUCT_ARCHIVE_MONTHLY
    value: 11e48c15-2345-49a3-a276-b2ec225d2c40
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POLAR_PRODUCT_ARCHIVE_YEARLY
    value: 888e08e7-bc88-49c1-a076-dff500a59fee
    availability:
      - BUILD
      - RUNTIME

  # ── Server-side secrets (хранятся в Firebase Secret Manager) ─────────────
  # На App Hosting firebase-admin использует ADC автоматически,
  # поэтому FIREBASE_ADMIN_* переменные нужны ТОЛЬКО для локального режима.
  # Раскомментируй если хочешь явно задать через секреты:
  #
  # - variable: FIREBASE_ADMIN_CLIENT_EMAIL
  #   secret: firebase-admin-client-email
  #   availability:
  #     - RUNTIME
  #
  # - variable: FIREBASE_ADMIN_PRIVATE_KEY
  #   secret: firebase-admin-private-key
  #   availability:
  #     - RUNTIME
